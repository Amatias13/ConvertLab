<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConvertLab ⚡ — One tool for every transformation</title>

    <!-- Primary -->
    <meta name="description" content="28+ developer tools — JSON, Base64, Regex, JWT, AI Enhancer, QR Code and more. 100% local, no accounts, no servers. Free & open-source." />
    <meta name="keywords" content="json formatter, base64, regex tester, markdown, jwt decoder, developer tools, converter, encoder, decoder, qr code" />
    <meta name="author" content="André Matias" />
    <link rel="canonical" href="https://amatias13.github.io/ConvertLab/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amatias13.github.io/ConvertLab/" />
    <meta property="og:title" content="ConvertLab ⚡ — One tool for every transformation" />
    <meta property="og:description" content="28+ developer tools — JSON, Base64, Regex, JWT, AI Enhancer and more. 100% local, free & open-source." />
    <meta property="og:image" content="https://amatias13.github.io/ConvertLab/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ConvertLab ⚡ — One tool for every transformation" />
    <meta name="twitter:description" content="28+ developer tools. 100% local, free & open-source." />
    <meta name="twitter:image" content="https://amatias13.github.io/ConvertLab/og-image.svg" />

    <!-- PWA -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#09090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ConvertLab" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%BASE_URL%sw.js', { scope: '%BASE_URL%' })
            .then(reg => console.log('[ConvertLab] SW registered', reg.scope))
            .catch(err => console.warn('[ConvertLab] SW registration failed', err))
        })
      }
    </script>
  </body>
</html>
